  <script>
// Fixed proportional pin scaling for map
function scaleMapPins() {
  const mapContainer = document.querySelector('.map-container');
  const mapImage = document.querySelector('.map-image');
  const pins = document.querySelectorAll('.map-pin');
  
  if (!mapContainer || !mapImage) return;
  
  // Wait for image to load completely
  if (!mapImage.complete) {
    mapImage.addEventListener('load', scaleMapPins);
    return;
  }
  
  // Get container dimensions
  const containerRect = mapContainer.getBoundingClientRect();
  
  // Get the natural (original) image dimensions
  const naturalWidth = mapImage.naturalWidth;
  const naturalHeight = mapImage.naturalHeight;
  
  // Get the displayed image dimensions (after object-fit: contain)
  const imageAspectRatio = naturalWidth / naturalHeight;
  const containerAspectRatio = containerRect.width / containerRect.height;
  
  let displayedWidth, displayedHeight;
  let offsetX = 0, offsetY = 0;
  
  if (imageAspectRatio > containerAspectRatio) {
    // Image is wider - constrained by container width
    displayedWidth = containerRect.width;
    displayedHeight = containerRect.width / imageAspectRatio;
    offsetY = (containerRect.height - displayedHeight) / 2;
  } else {
    // Image is taller - constrained by container height
    displayedHeight = containerRect.height;
    displayedWidth = containerRect.height * imageAspectRatio;
    offsetX = (containerRect.width - displayedWidth) / 2;
  }
  
  pins.forEach(pin => {
    const originalTop = parseFloat(pin.getAttribute('data-original-top'));
    const originalLeft = parseFloat(pin.getAttribute('data-original-left'));
    
    // Convert original percentages to actual positions within the displayed image
    const actualLeft = (originalLeft / 100) * displayedWidth + offsetX;
    const actualTop = (originalTop / 100) * displayedHeight + offsetY;
    
    // Convert back to percentages relative to the container
    const newLeft = (actualLeft / containerRect.width) * 100;
    const newTop = (actualTop / containerRect.height) * 100;
    
    pin.style.left = newLeft + '%';
    pin.style.top = newTop + '%';
  });
}

// Debounce function to limit how often scaling happens during resize
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

// Use debounced version for resize events
const debouncedScale = debounce(scaleMapPins, 100);

// Initialize scaling
window.addEventListener('load', () => {
  // Small delay to ensure everything is rendered
  setTimeout(scaleMapPins, 100);
});

window.addEventListener('resize', debouncedScale);

// Also scale when orientation changes on mobile
window.addEventListener('orientationchange', () => {
  setTimeout(scaleMapPins, 300);
});
</script>
