<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>DJ Yabi Photos</title>
  <link rel="stylesheet" href="style2.css">

  <script src="overlay-video.js" defer></script>
 
  <style>
  /* Replace your mobile CSS in index.html with this more specific version */

/* Default styles for all screen sizes */
body {
  margin: 0;
  background: #FAF9F6;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

.image-container {
  position: relative;
  width: 100%;
  height: 100%;
}

.splash-image {
  position: absolute;
  width: 300px;
  height: auto;
  object-fit: cover;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
  pointer-events: none;
  z-index: 1;
}

/* Mobile-specific overrides - more specific selectors */
@media screen and (max-width: 480px) {
  html {
    overflow: hidden !important;
    width: 100vw !important;
    height: 100vh !important;
  }
  
  body {
    overflow: hidden !important;
    width: 100vw !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #FAF9F6;
  }

  .image-container {
    position: relative !important;
    width: 100vw !important;
    height: 100vh !important;
    overflow: hidden !important;
  }

  .splash-image {
    position: absolute !important;
    width: 200px !important;
    height: auto !important;
    object-fit: cover !important;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.4) !important;
    pointer-events: none !important;
    z-index: 1 !important;
  }

  /* Ensure UI elements stay visible */
  .logo-container {
    z-index: 200 !important;
    position: fixed !important;
    top: 1rem !important;
    left: 1rem !important;
  }

  .bottom-menu {
    z-index: 200 !important;
    position: fixed !important;
    bottom: 1rem !important;
  }
}

/* Loading screen styles */
.loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #FAF9F6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s ease-out;
}

.loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.progress-bar {
  width: 200px;
  height: 4px;
  background: #e0e0e0;
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #8B4513;
  width: 0%;
  transition: width 0.3s ease;
}
  </style>
  
  <!-- Preload the first few images for faster initial display -->
  <link rel="preload" as="image" href="images/image00001.webp">
  <link rel="preload" as="image" href="images/image00003.webp">
  <link rel="preload" as="image" href="images/image00006.webp">
  <link rel="preload" as="image" href="images/P1020098.webp">
  <link rel="preload" as="image" href="images/image00010.webp">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <header>
        <div class="logo-container">
          <div class="logo" id="logo">
            <img src="images/logo marron.png" alt="DJ Yabi Logo" class="logo-image">
          </div>
        </div>
    </header>
    
    <main id="mainContent">
        <div class="image-container" id="imageContainer"></div>
    </main>
    
    <nav class="bottom-menu">
        <div class="menu-left">
          <a href="about.html">About</a>
          <a href="MyMixes.html">Mixes</a>
          <a href="videos.html">Videos</a>
        </div>
        <div class="menu-right">
          <a href="index.html">Photos</a>
          <a href="events.html">Events</a>
          <a href="contact.html">Contact</a>
        </div>
    </nav>
    
    <div id="teaserOverlay">
        <video loop id="teaserVideo" playsinline muted>
          <source src="videos/teaser.mp4" type="video/mp4" />
        </video>
    </div>
      
  <script>

// Fixed JavaScript with proper visibility handling

const images = [
  'images/image00026.webp',
  'images/image00003.webp',
  'images/image00006.webp',
  'images/P1020098.webp',
  'images/image00010.webp',
  'images/image00019.webp',
  'images/P1020092.webp',
  'images/image00025.webp',
  'images/P1020073.webp',
  'images/image00001.webp'
];

let index = 0;
const container = document.getElementById('imageContainer');
const loadingScreen = document.getElementById('loadingScreen');
const progressFill = document.getElementById('progressFill');
let currentImage = null;
let animationTimeout;
let isAnimationRunning = false; // Track animation state

// Preload images
const preloadedImages = [];
let imagesLoaded = 0;

function updateProgress() {
  const progress = (imagesLoaded / images.length) * 100;
  progressFill.style.width = `${progress}%`;
}

function hideLoadingScreen() {
  loadingScreen.classList.add('hidden');
  setTimeout(() => {
    if (loadingScreen.parentNode) {
      loadingScreen.parentNode.removeChild(loadingScreen);
    }
  }, 500);
}

function startAnimation() {
  console.log('Starting animation...'); // Debug
  hideLoadingScreen();
  isAnimationRunning = true;
  showNextImage(); // Show first image immediately
}

function stopAnimation() {
  console.log('Stopping animation...'); // Debug
  if (animationTimeout) {
    clearTimeout(animationTimeout);
    animationTimeout = null;
  }
  isAnimationRunning = false;
}

function resumeAnimation() {
  console.log('Resuming animation...'); // Debug
  if (!isAnimationRunning) {
    isAnimationRunning = true;
    // Resume with a normal delay, maintaining current index
    animationTimeout = setTimeout(showNextImage, 600);
  }
}

images.forEach((src, i) => {
  const img = new Image();
  img.src = src;
  img.onload = () => {
    imagesLoaded++;
    updateProgress();
    console.log(`Loaded image ${i + 1}/${images.length}`); // Debug
    if (imagesLoaded === images.length) {
      startAnimation();
    }
  };
  img.onerror = () => {
    console.error(`Failed to load image: ${src}`); // Debug
  };
  preloadedImages[i] = img;
});

function showNextImage() {
  // Don't proceed if animation is stopped
  if (!isAnimationRunning) {
    return;
  }
  
  console.log(`Showing image ${index + 1}/${images.length}: ${images[index]}`); // Debug
  
  // Clear any existing timeout first
  if (animationTimeout) {
    clearTimeout(animationTimeout);
    animationTimeout = null;
  }
  
  // Remove current image immediately
  if (currentImage) {
    container.removeChild(currentImage);
  }

  const img = preloadedImages[index].cloneNode();
  img.className = 'splash-image';
  
  // Mobile-friendly positioning with debugging
  const isMobile = window.innerWidth <= 480;
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  
  // Smaller random offset on mobile
  const offsetRange = isMobile ? 60 : 140;
  const offsetX = centerX + (Math.random() * offsetRange - offsetRange/2);
  const offsetY = centerY + (Math.random() * offsetRange - offsetRange/2);

  img.style.left = `${offsetX}px`;
  img.style.top = `${offsetY}px`;
  img.style.transform = 'translate(-50%, -50%)';
  img.style.width = isMobile ? '200px' : '300px';
  img.style.zIndex = '1';
  img.style.position = 'absolute';
  
  console.log(`Image positioned at: ${offsetX}, ${offsetY}`); // Debug

  container.appendChild(img);
  currentImage = img;

  // Determine delay BEFORE moving to next index
  let nextDelay = 600; // Normal delay
  
  // If the current image is the last one, pause longer
  if (index === images.length - 1) {
    nextDelay = 600;
    console.log('Last image shown, adding extra delay before first image');
  }
  
  // Move to next index after setting delay
  index = (index + 1) % images.length;
  
  // Schedule next image only if animation is still running
  if (isAnimationRunning) {
    animationTimeout = setTimeout(showNextImage, nextDelay);
  }
}

// Additional mobile debugging
window.addEventListener('load', () => {
  console.log('Window loaded');
  console.log('Container element:', container);
  if (container) {
    console.log('Container computed styles:', window.getComputedStyle(container));
  }
});

window.addEventListener('resize', () => {
  console.log('Window resized to:', window.innerWidth, 'x', window.innerHeight);
});

// FIXED: Proper visibility change handling
document.addEventListener('visibilitychange', () => {
  console.log('Visibility changed, hidden:', document.hidden); // Debug
  
  if (document.hidden) {
    // Page is hidden - stop animation
    stopAnimation();
  } else {
    // Page is visible again - resume animation
    // Add a small delay to ensure page is fully visible
    setTimeout(() => {
      if (!document.hidden) { // Double check we're still visible
        resumeAnimation();
      }
    }, 100);
  }
});

// Also handle window focus/blur for additional reliability
window.addEventListener('blur', () => {
  console.log('Window lost focus'); // Debug
  stopAnimation();
});

window.addEventListener('focus', () => {
  console.log('Window gained focus'); // Debug
  setTimeout(() => {
    if (!document.hidden) {
      resumeAnimation();
    }
  }, 100);
});
  </script>
  
</body>
</html>
